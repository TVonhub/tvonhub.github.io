    :root{
      --bg:#ffffff;
      --fg:#111111;
      --muted:#666;
      --card:#ffffff;
      --border:#e5e5e5;
      --accent:#2563eb;
      --row:#f7f7f7;
      --row-active:#e0ecff;
      --buffer:#2563eb;

      --orb-1:#60a5fa;
      --orb-2:#34d399;
      --orb-3:#f472b6;
      --orb-4:#f59e0b;

      --orb-opacity:.45;
      --orb-blur:40px;

      --battery-color:#2563eb;
    }

    body.dark{
      --bg:#0f1115;
      --fg:#e8eef5;
      --muted:#a3adc2;
      --card:#131722;
      --border:#1e2433;
      --accent:#60a5fa;
      --row:#0f141f;
      --row-active:#1f2b43;
      --buffer:#60a5fa;

      --orb-1:#60a5fa;
      --orb-2:#10b981;
      --orb-3:#fb7185;
      --orb-4:#f59e0b;

      --orb-opacity:.55;
      --orb-blur:50px;

      --battery-color:#60a5fa;
    }

    body.power-save{
      --battery-color:#10b981;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);

      font-family:
        ui-sans-serif,
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        "Helvetica Neue",
        Arial,
        "Noto Sans",
        "Liberation Sans";

      line-height:1.45;

      transition:
        background .25s,
        color .25s;
    }

    /* ================================
       Animated Background
       ================================ */

    #animated-bg{
      position:fixed;
      inset:0;

      z-index:0;

      pointer-events:none;

      overflow:hidden;
    }

    #animated-bg .orb{
      position:absolute;

      border-radius:50%;

      filter:
        blur(var(--orb-blur))
        saturate(140%);

      opacity:var(--orb-opacity);

      mix-blend-mode:screen;

      will-change:transform;

      transform:translate3d(0,0,0);

      background:
        radial-gradient(
          circle at 30% 30%,
          var(--c1),
          transparent 60%
        );

      width:var(--size);
      height:var(--size);

      left:var(--x);
      top:var(--y);

      animation:
        float
        var(--dur)
        linear
        infinite;

      animation-delay:
        var(--delay,0s);
    }

    @keyframes float{

      0%{
        transform:
          translate3d(0,0,0)
          rotate(0deg);
      }

      50%{
        transform:
          translate3d(var(--dx),var(--dy),0)
          rotate(180deg);
      }

      100%{
        transform:
          translate3d(0,0,0)
          rotate(360deg);
      }

    }

    @media (prefers-reduced-motion:reduce){

      #animated-bg .orb{
        animation:none;
      }

    }

    /* ================================
       Header
       ================================ */

    header{
      position:sticky;

      top:0;

      z-index:10;

      display:flex;

      align-items:center;

      gap:.5rem;

      padding:.75rem 1rem;

      border-bottom:
        1px solid var(--border);

      background:
        color-mix(
          in oklab,
          var(--bg) 85%,
          #ffffff 15%
        );

      backdrop-filter:blur(6px);
    }

    header h1{
      font-size:1rem;

      margin:0;

      font-weight:600;
    }

    header .spacer{
      flex:1;
    }

    header button{
      border:
        1px solid var(--border);

      background:var(--card);

      color:var(--fg);

      padding:.4rem .65rem;

      border-radius:.65rem;

      cursor:pointer;

      font-size:1rem;
    }

    header button#powerBtn{
      color:var(--battery-color);
    }

    /* ================================
       Main Layout
       VIDEO ด้านบน
       SEARCH ด้านล่าง
       ================================ */

    main{
      position:relative;

      z-index:1;

      display:flex;

      flex-direction:column;

      gap:1rem;

      padding:1rem;

      max-width:1200px;

      margin:0 auto;
    }

    main > section{
      order:1;

      width:100%;
    }

    main > aside{
      order:2;

      width:100%;
    }

    .panel{
      background:var(--card);

      border:
        1px solid var(--border);

      border-radius:16px;

      padding:1rem;
    }

    /* ================================
       Search
       ================================ */

    .field{
      display:block;

      width:100%;

      border:
        1px solid var(--border);

      border-radius:12px;

      padding:.6rem .75rem;

      background:var(--bg);

      color:var(--fg);
    }

    .label{

      margin-bottom:.35rem;

    }

    .list{

      padding:0;

      list-style:none;

      max-height:65vh;

      overflow:auto;

      border:
        1px solid var(--border);

    .row{

      align-items:center;

      gap:.6rem;

      padding:.55rem .7rem;

      border-bottom:
        1px solid var(--border);

      background:var(--bg);

      cursor:pointer;
    }

    .row:nth-child(odd){

    }

    .row:last-child{

    }

    .row:hover{
      filter:brightness(1.02);
    }

    .row.active{

    }

    .logo{

      height:26px;

      border-radius:6px;

    /* ================================
       Video
       ================================ */

      border-radius:16px;

      overflow:hidden;
    }

    video{

      aspect-ratio:16/9;

      background:#000;

      display:block;

    .status{

      font-size:.9rem;

      display:flex;

      align-items:center;

      gap:.75rem;

      flex-wrap:wrap;
    }

    .badge{

    }

    .buffer-rail{

      right:0;

      bottom:0;

      height:6px;

      background:#e5e7eb33;
    }

    .grid-gap{

       ================================ */

    }

    ::-webkit-scrollbar-track{

    }

    ::-webkit-scrollbar-thumb{

      border-radius:10px;

      opacity:0;

    }

    .show-scrollbar::-webkit-scrollbar-thumb{

    }

    ::-webkit-scrollbar-thumb:hover{

    /* ================================

      }

  <script>

    const PLAYLIST_URL =
      "https://Tvonhub.github.io/tv.m3u";

    const BUFFER_TARGET_SEC = 60;

    let allChannels = [];

    let viewChannels = [];

    let currentIndex = -1;

    let hls = null;

    let lang =
      localStorage.getItem("lang")
      || "th";

    let theme =
      localStorage.getItem("theme")
      || "light";

    let powerSave =
      localStorage.getItem("powerSave")
      === "true";


    const els = {

      video:
        document.getElementById("video"),

      bufferBar:
        document.getElementById("bufferBar"),

      bufInfo:
        document.getElementById("bufInfo"),

      list:
        document.getElementById("channelList"),

      count:
        document.getElementById("count"),

      search:
        document.getElementById("searchInput"),

      group:
        document.getElementById("groupFilter"),

      now:
        document.getElementById("nowPlaying"),

      langBtn:
        document.getElementById("langBtn"),

      themeBtn:
        document.getElementById("themeBtn")

    };


    const powerBtn =
      document.getElementById("powerBtn");


    document.body.classList.toggle(
      "dark",
      theme === "dark"
    );

    document.body.classList.toggle(
      "light",
      theme !== "dark"
    );

    document.body.classList.toggle(
      "power-save",
      powerSave
    );


    function t(th,en){

      return lang === "th"
        ? th
        : en;

    }


    /* ================================
       Parse M3U
       ================================ */

    function parseM3U(text){

      const lines =
        text.split(/\r?\n/);

      const out = [];

      let meta = null;


      for(const raw of lines){

        const line =
          raw.trim();

        if(!line)
          continue;


        if(line.startsWith("#EXTINF")){

          const group =
            /group-title="([^"]*)"/
            .exec(line)?.[1]
            ?? "";


          const logo =
            /tvg-logo="([^"]*)"/
            .exec(line)?.[1]
            ?? "";


          const name =
            line
            .split(",")
            .slice(1)
            .join(",")
            .trim()
            || "Channel";


          meta = {

            title:name,

            group:group,

            logo:logo

          };

        }

        else if(
          !line.startsWith("#")
          && meta
        ){

          out.push({

            ...meta,

            url:line

          });

          meta = null;

        }

      }


      return out;

    }


    /* ================================
       Groups
       ================================ */

    function renderGroups(){

      const groups =
        Array.from(
          new Set(
            allChannels.map(
              c =>
                c.group
                ||
                t(
                  "อื่นๆ",
                  "Others"
                )
            )
          )
        );


      els.group.innerHTML = "";


      const optAll =
        document.createElement(
          "option"
        );


      optAll.value =

        t(
          "ทุกกลุ่ม",
          "All groups"
        );


      els.group.appendChild(

      );


      groups.forEach(g => {

          document.createElement(
            "option"
          );

          g ||
          t(
            "อื่นๆ",
            "Others"
          );


        opt.textContent =
          g ||
          t(
            "อื่นๆ",
            "Others"
          );


        els.group.appendChild(
          opt
        );

      });


      els.group.value =

    }


    /* ================================
       Channel List
       ================================ */

    function renderList(){

      els.list.innerHTML = "";


      viewChannels.forEach(
        (c,i) => {

          const li =
            document.createElement(
              "li"
            );


          li.className =
            "row"
            +
            (
              i === currentIndex
                ? " active"
                : ""
            );


          li.title =
            c.title;


          li.innerHTML =
            (
              c.logo
              ?
              `<img
                class="logo"
                src="${c.logo}"
                onerror="this.style.display='none'"
              >`
              :
              ""
            )
            +
            `<span>${c.title}</span>`;


          li.addEventListener(
            "click",
            () =>
              playIndex(
                i,
                true
              )
          );


          els.list.appendChild(
            li
          );

        }
      );


      els.count.textContent =
        t(
          `${viewChannels.length} ช่อง`,
          `${viewChannels.length} channels`
        );

    }


    /* ================================
       Filter
       ================================ */

    function applyFilter(){

      const q =
        els.search.value
        .trim()
        .toLowerCase();


      const g =
        els.group.value;


      viewChannels =
        allChannels.filter(
          c => {

            const okText =
              !q
              ||
              c.title
              .toLowerCase()
              .includes(q);


            const okGroup =
              g === "__ALL__"
              ||
              (
                c.group
                ||
                t(
                  "อื่นๆ",
                  "Others"
                )
              ) === g;


            return (
              okText
              &&
              okGroup
            );

          }
        );


      renderList();

    }


    /* ================================
       HLS
       ================================ */

    function destroyHls(){

      if(hls){

        try{
          hls.destroy();
        }
        catch(e){}

        hls = null;

      }


      els.video.removeAttribute(
        "src"
      );

      els.video.load();

    }


    function playIndex(
      i,
      userSelect=false
    ){

      if(!viewChannels[i])
        return;


      currentIndex = i;


      const ch =
        viewChannels[i];


      localStorage.setItem(
        "lastUrl",
        ch.url
      );


      els.now.textContent =
        t(
          "กำลังเล่น: ",
          "Playing: "
        )
        +
        ch.title;


      destroyHls();


      if(
        typeof Hls !== "undefined"
        &&
        Hls.isSupported()
      ){

        hls =
          new Hls({

            maxBufferLength:60,

            maxBufferSize:
              60 *
              1024 *
              1024,

            maxBufferHole:2,

            liveSyncDuration:30,

            fragLoadingMaxRetry:10,

            manifestLoadingMaxRetry:5,

            levelLoadingMaxRetry:5

          });


        hls.loadSource(
          ch.url
        );


        hls.attachMedia(
          els.video
        );


        hls.on(
          Hls.Events.MANIFEST_PARSED,
          () => {

            els.video
              .play()
              .catch(
                () => {}
              );

          }
        );


        const update =
          () =>
            updateBufferBar();


        hls.on(
          Hls.Events.FRAG_BUFFERED,
          update
        );


        hls.on(
          Hls.Events.FRAG_LOADING,
          update
        );


        hls.on(
          Hls.Events.LEVEL_UPDATED,
          update
        );


        els.video.addEventListener(
          "timeupdate",
          update,
          {
            passive:true
          }
        );

      }

      else{

        els.video.src =
          ch.url;


        els.video
          .play()
          .catch(
            () => {}
          );


        els.video.addEventListener(
          "timeupdate",
          updateBufferBar,
          {
            passive:true
          }
        );

      }


      renderList();

    }


    /* ================================
       Buffer
       ================================ */

    function updateBufferBar(){

      const v =
        els.video;


      if(
        v.buffered.length === 0
      ){

        els.bufferBar.style.width =
          "0%";


        els.bufInfo.textContent =
          t(
            "Buffer: 0วินาที (0%)",
            "Buffer: 0s (0%)"
          );


        return;

      }


      const tNow =
        v.currentTime;


      let end =
        v.buffered.end(
          v.buffered.length - 1
        );


      for(
        let i=0;
        i<v.buffered.length;
        i++
      ){

        if(
          v.buffered.start(i)
          <= tNow
          &&
          tNow
          <= v.buffered.end(i)
        ){

          end =
            v.buffered.end(i);

          break;

        }

      }


      const bufferedSec =
        Math.max(
          0,
          end - tNow
        );


      const pct =
        Math.max(
          0,
          Math.min(
            100,
            (
              bufferedSec /
              BUFFER_TARGET_SEC
            ) * 100
          )
        );


      els.bufferBar.style.width =
        pct + "%";


      els.bufInfo.textContent =
        t(
          `Buffer: ${bufferedSec.toFixed(1)} วินาที (${pct.toFixed(0)}%)`,
          `Buffer: ${bufferedSec.toFixed(1)}s (${pct.toFixed(0)}%)`
        );

    }


    /* ================================
       Load Playlist
       ================================ */

    async function loadPlaylist(){

      try{

        const res =
          await fetch(
            PLAYLIST_URL,
            {
              cache:"no-cache"
            }
          );


        if(!res.ok){

          throw new Error(
            "HTTP " + res.status
          );

        }


        const text =
          await res.text();


        allChannels =
          parseM3U(text);


        renderGroups();


        viewChannels =
          allChannels.slice();


        renderList();


        const lastUrl =
          localStorage.getItem(
            "lastUrl"
          );


        let idx = 0;


        if(lastUrl){

          const found =
            viewChannels.findIndex(
              c =>
                c.url === lastUrl
            );


          if(found >= 0)
            idx = found;

        }


        if(viewChannels.length){

          playIndex(
            idx,
            false
          );

        }

      }
      catch(err){

        els.now.textContent =
          t(
            "โหลดเพลย์ลิสต์ไม่สำเร็จ",
            "Failed to load playlist"
          );


        console.error(
          err
        );

      }

    }


    /* ================================
       Language
       ================================ */

    function updateLangUI(){

      els.langBtn.textContent =
        lang === "th"
          ? "ไทย"
          : "EN";


      els.themeBtn.textContent =
        document.body
        .classList
        .contains("dark")
          ? "🌙"
          : "☀️";


      els.search.placeholder =
        t(
          "ค้นหาช่อง...",
          "Search channel..."
        );


      els.count.textContent =
        t(
          `${viewChannels.length} ช่อง`,
          `${viewChannels.length} channels`
        );

    }


    els.search.addEventListener(
      "input",
      () => {

        applyFilter();


        if(
          !viewChannels[currentIndex]
        ){

          if(viewChannels.length){

            playIndex(
              0,
              false
            );

          }

        }
        else{

          renderList();

        }

      }
    );


    els.group.addEventListener(
      "change",
      () => {

        applyFilter();


        if(
          !viewChannels[currentIndex]
          &&
          viewChannels.length
        ){

          playIndex(
            0,
            false
          );

        }

      }
    );


    els.langBtn.addEventListener(
      "click",
      () => {

        lang =
          lang === "th"
            ? "en"
            : "th";


        localStorage.setItem(
          "lang",
          lang
        );


        updateLangUI();

        renderList();

        renderGroups();

      }
    );


    els.themeBtn.addEventListener(
      "click",
      () => {

        const toDark =
          !document.body
          .classList
          .contains("dark");


        document.body.classList.toggle(
          "dark",
          toDark
        );


        document.body.classList.toggle(
          "light",
          !toDark
        );


        localStorage.setItem(
          "theme",
          toDark
            ? "dark"
            : "light"
        );


        updateLangUI();

      }
    );


    powerBtn.addEventListener(
      "click",
      () => {

        powerSave =
          !powerSave;


        localStorage.setItem(
          "powerSave",
          powerSave
        );


        document.body.classList.toggle(
          "power-save",
          powerSave
        );


        powerBtn.classList.add(
          "blink"
        );


        setTimeout(
          () =>
            powerBtn.classList.remove(
              "blink"
            ),
          500
        );

      }
    );


    loadPlaylist();


    /* ================================
       Donate
       ================================ */

    const toggleBtn =
      document.getElementById(
        "donate-toggle"
      );


    const card =
      document.getElementById(
        "donate-card"
      );


    function toggleDonate(
      show=true
    ){

      if(show){

        card.style.opacity =
          "1";

        card.style.transform =
          "translateY(0)";

        card.style.pointerEvents =
          "auto";

        toggleBtn.textContent =
          "❌ Close";

      }
      else{

        card.style.opacity =
          "0";

        card.style.transform =
          "translateY(30px)";

        card.style.pointerEvents =
          "none";

        toggleBtn.textContent =
          "💝 สนับสนุนเรา";

      }

    }


    toggleBtn.onclick =
      function(){

        if(
          card.style.opacity === "0"
          ||
          card.style.opacity === ""
        ){

          toggleDonate(
            true
          );

        }
        else{

          toggleDonate(
            false
          );

        }

      };


    /* ================================
       Scrollbar
       ================================ */

    let sbTimers =
      new WeakMap();


    function showScrollbar(el){

      el.classList.add(
        "show-scrollbar"
      );


      clearTimeout(
        sbTimers.get(el)
      );


      const timer =
        setTimeout(
          () =>
            el.classList.remove(
              "show-scrollbar"
            ),
          1000
        );


      sbTimers.set(
        el,
        timer
      );

    }


    document.addEventListener(
      "mousemove",
      e => {

        const el =
          e.target.closest("*");


        if(el)
          showScrollbar(el);

      }
    );


    document.addEventListener(
      "scroll",
      e => {

        const el =
          e.target;


        if(el)
          showScrollbar(el);

      },
      true
    );

  </script>

    /* ================================
       Presence
       ================================ */

    function startPresence(){

      const connectedRef =
        db.ref(
          ".info/connected"
        );


      const presenceRef =
        db.ref(
          "presence"
        );


      connectedRef.on(
        "value",
        snap => {

          if(
            snap.val() !== true
          ){

            onlineCountEl.textContent =
              "(กำลังเชื่อมต่อ...)";

            return;

          }


          const myPresence =
            presenceRef.push();


          myPresence
            .onDisconnect()
            .remove();


          myPresence
            .set({

              uid:
                auth.currentUser.uid,

              name:
                localStorage.getItem(
                  "chatName"
                )
                ||
                "ผู้ใช้",

              at:
                firebase.database
                .ServerValue
                .TIMESTAMP

            })

            .then(() => {

              console.log(
                "Presence connected"
              );

            })

            .catch(error => {

              console.error(
                "Presence Write Error:",
                error
              );


              onlineCountEl.textContent =
                "(Permission Error)";

            });

        }
      );


      presenceRef.on(
        "value",
        snap => {

          const count =
            snap.numChildren();


          onlineCountEl.textContent =

        error => {

        }

    /* ================================
       Chat
       ================================ */

    function startChat(){

      const chatRef =
        db.ref(
          "chat"
        );


      chatRef.on(
        "child_added",
        snap => {

          const msg =
            snap.val();


          const div =
            document.createElement(
              "div"
            );


          div.style.padding =
            "4px 0";


          div.textContent =
            `${msg.name || "ผู้ใช้"}: ${msg.text || ""}`;


          chatMessages.appendChild(
            div
          );


          chatMessages.scrollTop =
            chatMessages.scrollHeight;

        },

        error => {

          console.error(
            "Chat Read Error:",
            error
          );

        }
      );


      /* ================================
         Send Chat
         ================================ */

      chatInput.addEventListener(
        "keypress",
        e => {

          if(
            e.key === "Enter"
            &&
            chatInput.value.trim()
            !== ""
          ){

            const text =
              chatInput.value.trim();


            const message = {

              name:
                localStorage.getItem(
                  "chatName"
                )
                ||
                "ผู้ใช้",

              text:text,

              timestamp:
                firebase.database
                .ServerValue
                .TIMESTAMP

            };


            chatRef
              .push(message)

              .then(() => {

                console.log(
                  "Message sent"
                );


                chatInput.value =
                  "";

              })

              .catch(error => {

                console.error(
                  "Chat Send Error:",
                  error
                );

              });

          }

        }
      );

    }
